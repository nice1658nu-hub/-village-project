<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
  <defs>
    <style>
      text { font-family: "Tahoma", "Noto Sans Thai", sans-serif; fill: #172033; }
      .title { font-size: 28px; font-weight: 700; }
      .actor-label { font-size: 22px; font-weight: 700; text-anchor: middle; }
      .case-text { font-size: 19px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
      .boundary { fill: #fff; stroke: #344054; stroke-width: 3; }
      .case { fill: #fff4cc; stroke: #bf8b18; stroke-width: 2.3; }
      .actor { fill: none; stroke: #344054; stroke-width: 3; stroke-linecap: round; }
      .link { fill: none; stroke: #667085; stroke-width: 2; }
      .include { fill: none; stroke: #667085; stroke-width: 2; stroke-dasharray: 8 7; }
      .note { font-size: 15px; fill: #475467; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/>
    </marker>
  </defs>

  <rect width="1600" height="1180" fill="#ffffff"/>
  <text x="800" y="48" class="title" text-anchor="middle">Use Case Diagram ระบบแจ้งเหตุ ติดตาม และวิเคราะห์ปัญหาชุมชนอัจฉริยะ</text>

  <rect x="285" y="78" width="1030" height="1045" rx="4" class="boundary"/>
  <text x="800" y="112" font-size="19" font-weight="700" text-anchor="middle">ระบบแจ้งเหตุ ติดตาม และวิเคราะห์ปัญหาชุมชนอัจฉริยะ</text>

  <!-- Citizen actor -->
  <circle cx="105" cy="250" r="29" class="actor"/>
  <line x1="105" y1="279" x2="105" y2="360" class="actor"/>
  <line x1="55" y1="315" x2="155" y2="315" class="actor"/>
  <line x1="105" y1="360" x2="60" y2="425" class="actor"/>
  <line x1="105" y1="360" x2="150" y2="425" class="actor"/>
  <text x="105" y="462" class="actor-label">ประชาชน</text>

  <!-- Village actor -->
  <circle cx="105" cy="650" r="29" class="actor"/>
  <line x1="105" y1="679" x2="105" y2="760" class="actor"/>
  <line x1="55" y1="715" x2="155" y2="715" class="actor"/>
  <line x1="105" y1="760" x2="60" y2="825" class="actor"/>
  <line x1="105" y1="760" x2="150" y2="825" class="actor"/>
  <text x="105" y="862" class="actor-label">ผู้ดูแลหมู่บ้าน</text>

  <!-- TAO actor -->
  <circle cx="1495" cy="525" r="29" class="actor"/>
  <line x1="1495" y1="554" x2="1495" y2="635" class="actor"/>
  <line x1="1445" y1="590" x2="1545" y2="590" class="actor"/>
  <line x1="1495" y1="635" x2="1450" y2="700" class="actor"/>
  <line x1="1495" y1="635" x2="1540" y2="700" class="actor"/>
  <text x="1495" y="738" class="actor-label">เจ้าหน้าที่ อบต.</text>

  <!-- Citizen use cases -->
  <ellipse cx="520" cy="185" rx="165" ry="43" class="case"/>
  <text x="520" y="185" class="case-text">สมัครสมาชิก / เข้าสู่ระบบ</text>
  <ellipse cx="520" cy="295" rx="165" ry="43" class="case"/>
  <text x="520" y="295" class="case-text">ดูข่าวสารและประกาศ</text>
  <ellipse cx="520" cy="405" rx="165" ry="43" class="case"/>
  <text x="520" y="405" class="case-text">แจ้งเหตุและระบุตำแหน่ง</text>
  <ellipse cx="520" cy="515" rx="165" ry="43" class="case"/>
  <text x="520" y="515" class="case-text">ติดตามสถานะเรื่อง</text>
  <ellipse cx="520" cy="625" rx="165" ry="43" class="case"/>
  <text x="520" y="625" class="case-text">ประเมินผลการแก้ไข</text>

  <!-- Village use cases -->
  <ellipse cx="800" cy="240" rx="170" ry="43" class="case"/>
  <text x="800" y="240" class="case-text">ตรวจสอบเหตุในพื้นที่</text>
  <ellipse cx="800" cy="350" rx="170" ry="43" class="case"/>
  <text x="800" y="350" class="case-text">บันทึกผลและรูปหน้างาน</text>
  <ellipse cx="800" cy="460" rx="170" ry="43" class="case"/>
  <text x="800" y="460" class="case-text">ขอข้อมูลจากประชาชน</text>
  <ellipse cx="800" cy="570" rx="170" ry="43" class="case"/>
  <text x="800" y="570" class="case-text">ส่งเรื่องให้ อบต.</text>
  <ellipse cx="800" cy="680" rx="170" ry="43" class="case"/>
  <text x="800" y="680" class="case-text">ตอบข้อมูลเพิ่มเติมให้ อบต.</text>
  <ellipse cx="800" cy="790" rx="170" ry="43" class="case"/>
  <text x="800" y="790" class="case-text">ยุติเรื่องที่ไม่พบเหตุ</text>

  <!-- TAO use cases -->
  <ellipse cx="1085" cy="185" rx="170" ry="43" class="case"/>
  <text x="1085" y="185" class="case-text">รับเรื่องจากหมู่บ้าน</text>
  <ellipse cx="1085" cy="295" rx="170" ry="43" class="case"/>
  <text x="1085" y="295" class="case-text">ขอข้อมูลจากหมู่บ้าน</text>
  <ellipse cx="1085" cy="405" rx="170" ry="43" class="case"/>
  <text x="1085" y="405" class="case-text">มอบหมายหน่วยงาน</text>
  <ellipse cx="1085" cy="515" rx="170" ry="43" class="case"/>
  <text x="1085" y="515" class="case-text">บันทึกความคืบหน้า</text>
  <ellipse cx="1085" cy="625" rx="170" ry="43" class="case"/>
  <text x="1085" y="625" class="case-text">บันทึกผลและปิดเรื่อง</text>
  <ellipse cx="1085" cy="735" rx="170" ry="43" class="case"/>
  <text x="1085" y="735" class="case-text">จัดการงบประมาณ</text>
  <ellipse cx="1085" cy="845" rx="170" ry="43" class="case"/>
  <text x="1085" y="845" class="case-text">วิเคราะห์ข้อมูล</text>
  <ellipse cx="1085" cy="955" rx="170" ry="43" class="case"/>
  <text x="1085" y="955" class="case-text">ออกรายงาน</text>

  <!-- Citizen links -->
  <path d="M155 300 L355 185" class="link"/>
  <path d="M155 310 L355 295" class="link"/>
  <path d="M155 320 L355 405" class="link"/>
  <path d="M155 330 L355 515" class="link"/>
  <path d="M155 340 L355 625" class="link"/>

  <!-- Village links -->
  <path d="M155 690 L630 240" class="link"/>
  <path d="M155 700 L630 350" class="link"/>
  <path d="M155 710 L630 460" class="link"/>
  <path d="M155 720 L630 570" class="link"/>
  <path d="M155 730 L630 680" class="link"/>
  <path d="M155 740 L630 790" class="link"/>

  <!-- TAO links -->
  <path d="M1445 570 L1255 185" class="link"/>
  <path d="M1445 575 L1255 295" class="link"/>
  <path d="M1445 580 L1255 405" class="link"/>
  <path d="M1445 585 L1255 515" class="link"/>
  <path d="M1445 595 L1255 625" class="link"/>
  <path d="M1445 600 L1255 735" class="link"/>
  <path d="M1445 605 L1255 845" class="link"/>
  <path d="M1445 610 L1255 955" class="link"/>

  <!-- Include / extend relationships -->
  <path d="M685 405 C725 405 735 310 760 280" class="include" marker-end="url(#arrow)"/>
  <text x="718" y="347" class="note">«include»</text>
  <path d="M970 570 C1005 550 1010 225 1035 225" class="include" marker-end="url(#arrow)"/>
  <text x="995" y="365" class="note">«include»</text>
  <path d="M1085 668 L1085 625" class="include" marker-end="url(#arrow)"/>
  <text x="1150" y="653" class="note">«include»</text>

  <text x="800" y="1085" font-size="17" fill="#475467" text-anchor="middle">ประชาชนแจ้งเหตุ → หมู่บ้านตรวจสอบ → ส่งต่อ อบต. → อบต.ดำเนินการ → ประชาชนประเมินผล</text>
</svg>
